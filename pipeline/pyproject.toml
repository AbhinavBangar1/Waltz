[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waltz-pipeline"
version = "0.1.0"
description = "NISAR Surface-Change Explorer data pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "typer>=0.12.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pillow>=10.2.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
waltz = "waltz_pipeline.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
