story:
  what_changed: Coseismic interferometry reveals up to 18.2 cm of line-of-sight surface displacement across the active fault line. The eastern block shifted primarily toward the satellite sensor while the western fault block experienced subsidence and westward motion.
  drivers: Shallow strike-slip fault rupture associated with the Boconó Fault zone within the northern Andean deformation belt.
  caveats: Motion is measured along the satellite line of sight (~37° incidence angle), not pure vertical or horizontal slip. Tropospheric water vapor delay can induce local ~1-2 cm phase artifacts. Areas with coherence below 0.3 are masked in grey.
  radar_explainer: Each repeating color fringe represents exactly one half-wavelength cycle of ground displacement (11.9 cm for NISAR's 23.8 cm L-band carrier). Tightly packed concentric fringes indicate steep strain gradients.
