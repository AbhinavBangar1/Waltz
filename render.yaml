services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: waltz-pipeline-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: python -m uvicorn pipeline.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true

  # 2. React Vite Frontend Static Site
  - type: web
    name: waltz-web
    env: static
    region: oregon
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
